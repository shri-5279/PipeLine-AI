services:

  db:
    image: postgres:15
    container_name: pipeline-ai-db
    environment:
      POSTGRES_USER: pipelineai
      POSTGRES_PASSWORD: PipelineAI2024!
      POSTGRES_DB: pipelineai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelineai -d pipelineai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeline-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    container_name: pipeline-ai-ingestion
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: